version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 10
    versioning-strategy: increase
    commit-message:
      prefix: 'chore(deps)'
      prefix-development: 'chore(dev-deps)'
    labels: ['dependencies', 'npm']
    cooldown:
      default-days: 3
      semver-major-days: 14
    ignore:
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
    groups:
      svelte:
        patterns:
          - 'svelte'
          - 'svelte-check'
          - '@sveltejs*'
      vite:
        patterns:
          - 'vite'
          - 'vitest'
          - '@vitest*'
          - 'vitest-browser-svelte'
      playwright:
        patterns:
          - 'playwright'
          - '@playwright*'
      testing-library:
        patterns:
          - '@testing-library*'
          - 'jsdom'
      tailwind:
        patterns:
          - 'tailwindcss'
          - '@tailwindcss*'
          - 'prettier-plugin-tailwindcss'
      lint-and-format:
        patterns:
          - 'eslint'
          - 'eslint-*'
          - '@eslint*'
          - 'typescript-eslint'
          - 'globals'
          - 'prettier'
          - 'prettier-plugin-svelte'
          - 'typescript'
      shaka:
        patterns:
          - 'shaka-player'
          - 'shaka-player-ui-controls'
      minor-and-patch:
        update-types: ['minor', 'patch']
        exclude-patterns:
          - '@xmldom/xmldom'
          - 'lucide-svelte'

  - package-ecosystem: 'docker'
    directory: '/'
    schedule:
      interval: 'weekly'
    commit-message:
      prefix: 'chore(docker)'
    labels: ['dependencies', 'docker']
    ignore:
      - dependency-name: 'node'
        update-types: ['version-update:semver-major']

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'monthly'
    commit-message:
      prefix: 'chore(ci)'
    labels: ['dependencies', 'ci']
    groups:
      actions:
        patterns: ['*']
