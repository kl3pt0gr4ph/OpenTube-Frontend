# test suite with coverage across the configured Node version(s).
# See: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs
name: Node.js CI

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

# Least-privilege token: the default grants far more than a build/test job needs.
permissions:
  contents: read

# Cancel superseded runs on the same branch/PR instead of letting them stack up.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version: [24]
    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - run: npm ci

      # PUBLIC_* vars are baked into the client bundle at build time, so they
      # must be set before `build`. They're public by design once shipped.
      - name: Set up environment variables
        run: |
          echo "PUBLIC_API_URL=${{ secrets.PUBLIC_API_URL }}" >> "$GITHUB_ENV"
          echo "PUBLIC_PROXY_URL=${{ secrets.PUBLIC_PROXY_URL }}" >> "$GITHUB_ENV"

      # --if-present so the pipeline doesn't hard-fail if a script isn't defined.
      # Add "lint" and "check" (svelte-check) scripts to package.json to enable.
      - name: Lint
        run: npm run lint --if-present

      - name: Type check
        run: npm run check --if-present

      - name: Build
        run: npm run build --if-present

      # Runs the full suite AND collects coverage in one pass — no separate
      # uninstrumented test step needed.
      - name: Test with coverage
        run: npm run test:coverage

      # Keep the coverage report as a downloadable artifact. Swap/add a Codecov
      # step here if you want PR-level coverage tracking and diffs.
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-node-${{ matrix.node-version }}
          path: coverage/
          if-no-files-found: ignore
