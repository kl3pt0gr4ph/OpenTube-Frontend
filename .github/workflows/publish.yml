# Publishes a release when a vX.Y.Z tag is pushed.
#
# Builds the tagged commit — not whatever main happens to be at — and
# derives every Docker tag from the git tag, so the two can never drift.
#
# Requires two repository secrets:
#   DOCKERHUB_USERNAME  - Docker Hub account name
#   DOCKERHUB_TOKEN     - Docker Hub access token (not the password)

name: publish

on:
  push:
    tags:
      - 'v*.*.*'

env:
  IMAGE_NAME: mrtumble/opentube-frontend
  PUBLIC_API_URL: /api
  PUBLIC_PROXY_URL: /proxy

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@v7

      - name: Verify package.json version matches the tag
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(jq -r '.version' package.json)"
          echo "tag=$TAG_VERSION package.json=$PKG_VERSION"
          [ "$TAG_VERSION" = "$PKG_VERSION" ] || {
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION"
            exit 1
          }

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      # type=semver strips the leading v. `latest` is applied only to the
      # highest non-prerelease version, and a tag like v1.3.0-rc.1 is
      # recognised as a prerelease, so it receives only its full version.
      - name: Derive image tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            PUBLIC_API_URL=${{ env.PUBLIC_API_URL }}
            PUBLIC_PROXY_URL=${{ env.PUBLIC_PROXY_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Pulls the section for this version out of CHANGELOG.md: start at
      # the matching heading, stop at the next one.
      - name: Extract release notes
        id: notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { flag = 1; next }
            /^## \[/ { flag = 0 }
            /^\[[^]]+\]: / { flag = 0 }
            flag
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "No CHANGELOG section for $VERSION" > release-notes.md
          fi

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRERELEASE=""
          case "$GITHUB_REF_NAME" in
            *-*) PRERELEASE="--prerelease" ;;
          esac
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            --verify-tag \
            $PRERELEASE
